<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter and Lotto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Счетчик</h2>
    <div id="count-display" class="zero">0</div>
    <div class="btn-group">
      <button id="btn-decrease">Уменьшить</button>
      <button id="btn-reset">Сбросить</button>
      <button id="btn-increase">Увеличить</button>
    </div>
  </div>

  <div class="card">
    <h2>Игра "Лото"</h2>
    <div id="lotto-container" class="lotto-balls-container"></div>
    <button id="btn-generate">Сгенерировать числа</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
