<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Oudomania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body style="background-color: #f9f9f9;">

    <header class="header bg-white border-bottom sticky-top shadow-sm">
        <nav class="navbar navbar-light py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand logo text-uppercase" href="../index.html">OUDOMANIA</a>
                <div class="d-flex gap-3">
                    <a href="profile.html" class="text-decoration-none">👤</a>
                    <a href="cart.html" class="text-decoration-none">🛒</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="text-uppercase text-center mb-5">Ваша корзина</h2>
        
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="bg-white p-4 shadow-sm mb-4">
                    <div data-cart-items aria-live="polite"></div>
                    <hr>
                    <h4 class="text-end">Итого: <span data-cart-total>0 ₽</span></h4>
                </div>

                <div class="bg-white p-4 shadow-sm" data-checkout>
                    <h5 class="text-uppercase mb-4">Оформление заказа</h5>
                    
                    <form action="https://t.me/+79999797256" method="GET" target="_blank">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="address" placeholder="Ваш адрес доставки" required>
                        </div>
                        <div class="mb-4">
                            <input type="text" class="form-control" name="card" placeholder="Номер карты (16 цифр)" pattern="\d{16}" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-3 text-uppercase">Оплатить заказ</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/shop.js"></script>
</body>
</html>
